global
    maxconn 256

defaults
    mode http
    timeout connect 1s
    timeout client 15s
    timeout server 10s
    timeout check 1s
    retries 2
    option redispatch

resolvers docker
    nameserver docker_dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s

frontend workwise
    bind :8080
    default_backend api_nodes

backend api_nodes
    balance roundrobin
    option httpchk GET /ready
    http-check expect status 200
    http-response set-header X-WorkWise-Backend %[srv_name]
    server api-a api:8000 check inter 1s fall 2 rise 1 resolvers docker init-addr libc,none
    server api-b api-replica:8000 check inter 1s fall 2 rise 1 resolvers docker init-addr libc,none
