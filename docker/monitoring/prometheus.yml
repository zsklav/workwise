global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: workwise-api
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/metrics-token
    static_configs:
      - targets: [api:8000]
  - job_name: workwise-inbox
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/metrics-token
    static_configs:
      - targets: [notification-api:8000]
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: [rabbitmq:15692]
