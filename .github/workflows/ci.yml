name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPASSWORD: ci-only-postgres-password
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      DB_HOST: 127.0.0.1
      DB_NAME: workwise
      DB_USER: workwise_app
      DB_PASSWORD: ci-only-runtime-password
      MIGRATION_DB_USER: workwise_migrator
      MIGRATION_DB_PASSWORD: ci-only-migration-password
      JWT_SECRET: ci-only-signing-key-for-disposable-tests-never-use-outside-the-runner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Bootstrap isolated databases and roles
        run: bash docker/postgres/init.sh
      - name: Apply fresh migrations and grants
        run: python -m scripts.database.migrate
      - name: Check dependency and schema consistency
        run: |
          python -m pip check
          python -m alembic check
          python -c "from workwise.db.session import engine; from sqlalchemy import text; connection = engine.connect(); connection.execute(text('SELECT version_num FROM public.alembic_version')); connection.close()"
      - name: Run PostgreSQL tests
        run: python -m pytest -q --tb=short
      - name: Measure SQL plans on temporary fixtures
        run: python -m scripts.performance.query_plan
      - name: Save query plan evidence
        uses: actions/upload-artifact@v7
        with:
          name: query-plan-measurement
          path: performance-results/query-plan.json
          retention-days: 7

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROFILES: monitoring
    steps:
      - uses: actions/checkout@v6
      - name: Generate disposable credentials
        run: python3 -m scripts.docker.create_env
      - name: Validate Compose
        run: docker compose --env-file .env.docker config --quiet
      - name: Build and start isolated stack
        run: docker compose --env-file .env.docker up --build --detach --wait --wait-timeout 180
      - name: Verify runtime user and credential separation
        run: |
          docker compose --env-file .env.docker exec -T api python -c "import os; assert os.getuid() == 10001; assert 'MIGRATION_DB_PASSWORD' not in os.environ; assert 'POSTGRES_PASSWORD' not in os.environ"
      - name: Smoke test through HTTP
        run: python3 -m scripts.smoke.api
      - name: Verify concurrent HTTP writes
        run: python3 -m scripts.smoke.concurrency
      - name: Measure bounded HTTP workloads on disposable fixture
        run: docker compose --env-file .env.docker run --rm --no-deps benchmark
      - name: Collect HTTP measurement reports
        if: always()
        run: |
          mkdir -p performance-results
          docker compose --env-file .env.docker run --rm --no-deps benchmark cat /app/performance-results/http.json > performance-results/docker-http.json
          docker compose --env-file .env.docker run --rm --no-deps benchmark cat /app/performance-results/http.md > performance-results/docker-http.md
      - name: Save HTTP measurement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-http-measurement
          path: |
            performance-results/docker-http.json
            performance-results/docker-http.md
          retention-days: 7
      - name: Validate monitoring configuration and alert rules
        run: |
          docker compose --env-file .env.docker exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
          docker compose --env-file .env.docker exec -T prometheus promtool test rules /etc/prometheus/alerts.test.yml
      - name: Exercise broker and worker failure recovery
        run: python3 -m scripts.smoke.distributed --allow-service-interruption
      - name: Verify inbox workflow and exported distributed traces
        run: python3 -m scripts.smoke.notifications --allow-service-interruption
      - name: Verify monitoring, alerts and retention through running services
        run: python3 -m scripts.smoke.monitoring --allow-service-interruption
      - name: Verify session security, throttles and broker permission boundaries
        run: python3 -m scripts.smoke.security
      - name: Verify retries, application workflow and multiple-instance failure recovery
        run: python3 -m scripts.smoke.scale --allow-service-interruption
      - name: Verify isolated backups and restore both databases
        run: python3 -m scripts.smoke.backup --allow-service-interruption
      - name: Save restore verification evidence without database archives
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: database-restore-verification
          path: backup-reports/*.json
          retention-days: 7
          if-no-files-found: warn
      - name: Show API and migration diagnostics on failure
        if: failure()
        run: docker compose --env-file .env.docker --profile scale logs --no-color --tail 150 api api-replica gateway migrate publisher publisher-replica notification-worker worker-replica rabbitmq broker-setup notification-db notification-migrate notification-api jaeger monitoring-secrets prometheus grafana
      - name: Stop disposable stack
        if: always()
        run: docker compose --env-file .env.docker --profile scale down --volumes
