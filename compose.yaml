name: workwise-docker

services:
  monitoring-secrets:
    image: workwise-api:local
    build: .
    profiles: [monitoring]
    user: "0:0"
    command: ["python", "-m", "scripts.docker.monitoring_secrets"]
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?Add missing .env.docker keys}
    volumes:
      - monitoring_secrets:/secrets
    healthcheck:
      disable: true
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=512MB"]
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./docker/monitoring/alerts.test.yml:/etc/prometheus/alerts.test.yml:ro
      - monitoring_secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      monitoring-secrets:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: workwise_admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Add missing .env.docker keys}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  retention-outbox:
    image: workwise-api:local
    build: .
    profiles: [tools]
    command: ["python", "-m", "workwise.operations.retention", "outbox"]
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:?Generate .env.docker first}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Generate .env.docker first}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  retention-inbox:
    image: workwise-api:local
    build: .
    profiles: [tools]
    command: ["python", "-m", "workwise.operations.retention", "inbox"]
    environment:
      NOTIFICATION_ADMIN_PASSWORD: ${NOTIFICATION_ADMIN_PASSWORD:?Generate .env.docker first}
      NOTIFICATION_API_DB_PASSWORD: ${NOTIFICATION_API_DB_PASSWORD:?Add missing .env.docker keys}
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

  notification-migrate:
    image: workwise-api:local
    build: .
    command: ["python", "-m", "scripts.database.migrate_notifications"]
    environment:
      NOTIFICATION_ADMIN_PASSWORD: ${NOTIFICATION_ADMIN_PASSWORD:?Generate .env.docker first}
      NOTIFICATION_API_DB_PASSWORD: ${NOTIFICATION_API_DB_PASSWORD:?Add missing .env.docker keys}
    depends_on:
      notification-db:
        condition: service_healthy
    restart: "no"

  notification-api:
    image: workwise-api:local
    build: .
    command: ["python", "-m", "uvicorn", "workwise.notifications.api:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      NOTIFICATION_API_DB_PASSWORD: ${NOTIFICATION_API_DB_PASSWORD:?Add missing .env.docker keys}
      NOTIFICATION_SERVICE_SECRET: ${NOTIFICATION_SERVICE_SECRET:?Add missing .env.docker keys}
      METRICS_TOKEN: ${METRICS_TOKEN:?Add missing .env.docker keys}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: workwise
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Generate .env.docker first}
    hostname: rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  notification-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: notifications
      POSTGRES_PASSWORD: ${NOTIFICATION_ADMIN_PASSWORD:?Generate .env.docker first}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Generate .env.docker first}
    volumes:
      - notification_data:/var/lib/postgresql/data
      - ./docker/notifications/init.sh:/docker-entrypoint-initdb.d/01-notifications.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  publisher:
    image: workwise-api:local
    build: .
    command: ["python", "-m", "workwise.messaging.publisher"]
    environment:
      DB_HOST: db
      DB_NAME: workwise
      DB_USER: workwise_app
      DB_PASSWORD: ${DB_PASSWORD:?Generate .env.docker first}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Generate .env.docker first}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "workwise.messaging.health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  notification-worker:
    image: workwise-api:local
    build: .
    command: ["python", "-m", "workwise.messaging.worker"]
    environment:
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Generate .env.docker first}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Generate .env.docker first}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      rabbitmq:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "workwise.messaging.health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env.docker first}
      DB_PASSWORD: ${DB_PASSWORD:?Generate .env.docker first}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Generate .env.docker first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-workwise.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: workwise-api:local
    build: .
    command: ["python", "-m", "scripts.database.migrate"]
    environment:
      DB_HOST: db
      DB_NAME: workwise
      DB_USER: workwise_app
      DB_PASSWORD: ${DB_PASSWORD:?Generate .env.docker first}
      MIGRATION_DB_USER: workwise_migrator
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Generate .env.docker first}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  admin:
    image: workwise-api:local
    build: .
    profiles: [tools]
    command: ["python", "-m", "workwise.cli.manage_users", "create-admin", "workwise_admin"]
    environment:
      DB_HOST: db
      DB_NAME: workwise
      DB_USER: workwise_app
      DB_PASSWORD: ${DB_PASSWORD:?Generate .env.docker first}
      MIGRATION_DB_USER: workwise_migrator
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Generate .env.docker first}
      JWT_SECRET: ${JWT_SECRET:?Generate .env.docker first}
    depends_on:
      migrate:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    restart: "no"

  api:
    image: workwise-api:local
    build: .
    environment:
      DB_HOST: db
      DB_NAME: workwise
      DB_USER: workwise_app
      DB_PASSWORD: ${DB_PASSWORD:?Generate .env.docker first}
      JWT_SECRET: ${JWT_SECRET:?Generate .env.docker first}
      NOTIFICATION_SERVICE_URL: http://notification-api:8000
      METRICS_TOKEN: ${METRICS_TOKEN:?Add missing .env.docker keys}
      NOTIFICATION_SERVICE_SECRET: ${NOTIFICATION_SERVICE_SECRET:?Add missing .env.docker keys}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  monitoring_secrets:
  prometheus_data:
  grafana_data:
  postgres_data:
  notification_data:
  rabbitmq_data:
